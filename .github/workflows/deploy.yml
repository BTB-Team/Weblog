name: Deploy Weblog

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build_and_validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Automatically clean up the stale writings collection block from db.json
      - name: Clean and repair db.json duplicate lines
        run: sed -i '44,73d' db.json

      # Verify that db.json is perfectly valid after the line removal step
      - name: Validate db.json integrity
        run: node -e "JSON.parse(require('fs').readFileSync('db.json', 'utf8')); console.log('db.json is valid JSON')"

      - name: Build production bundle
        run: npm run build

      - name: Setup GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Upload production build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build_and_validate

    steps:
      - name: Deploy compiled assets to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
